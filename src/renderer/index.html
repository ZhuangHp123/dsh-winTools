<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
    <title>dsh-winTools</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="launcher compact" id="launcher">
      <div class="search-row">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <line x1="15.5" y1="15.5" x2="21" y2="21" />
        </svg>
        <input
          id="query"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="搜索应用、文件、剪贴板…"
        />
        <span class="mode-badge" id="mode" hidden></span>
      </div>

      <ul class="results" id="results" role="listbox"></ul>
      <div class="empty" id="empty" hidden></div>

      <footer class="status-bar">
        <span id="status-left" class="status-left"></span>
        <span id="status-right" class="status-right"></span>
      </footer>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
