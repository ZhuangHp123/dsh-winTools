<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
    <title>dsh-winTools</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="launcher compact" id="launcher">
      <div class="search-row">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <line x1="15.5" y1="15.5" x2="21" y2="21" />
        </svg>
        <input
          id="query"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="搜索应用、文件、剪贴板…"
        />
        <span class="mode-badge" id="mode" hidden></span>
      </div>

      <ul class="results" id="results" role="listbox"></ul>
      <div class="empty" id="empty" hidden></div>

      <footer class="status-bar">
        <span id="status-left" class="status-left"></span>
        <span id="status-right" class="status-right"></span>
      </footer>

      <section class="settings" id="settings" hidden aria-label="搜索前缀设置">
        <header class="settings-head">
          <span class="settings-title">自定义搜索前缀</span>
          <span class="settings-hint">每类只能一个前缀，中文英文都行、不限长度，不能含空格；清空恢复默认</span>
        </header>
        <ul class="settings-list" id="settings-list"></ul>
        <footer class="settings-foot">
          <span class="settings-msg" id="settings-msg"></span>
          <div class="settings-actions">
            <button class="btn ghost" id="settings-cancel" type="button">取消</button>
            <button class="btn primary" id="settings-save" type="button">保存</button>
          </div>
        </footer>
      </section>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
